name: RelayAI CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Validation (Python 3.14 / FastAPI / Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/test_backend.py -v

  frontend-checks:
    name: Frontend Validation (TypeScript / Jest / Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript Typecheck
        run: npx --workspace=apps/mobile tsc --noEmit

      - name: Run Architecture & Jest Suite
        run: npx jest --ci
